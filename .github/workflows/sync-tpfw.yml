name: Sync Pixel Touchpad Files

on:
  schedule:
    - cron: '0 0 * * *'  # Every minute for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ensure directories exist
      run: mkdir -p temp touchpad

    - name: Download and compare files
      id: sync
      run: |
        set -e
        base_url="https://www.mrchromebox.tech/files/firmware/other/"
        declare -A files
        files=(
        "rose_v1.1.8546-ee1861e9e.bin"
        "rose_v2.0.653-dfd8046c6.bin"
        )

        changed=false

        for file in "${files[@]}"; do
        echo "🔄 Syncing $file"
        max_attempts=5
        attempt=1
        success=false

        while [ $attempt -le $max_attempts ]; do
            echo "➤ Attempt $attempt for $file"
            curl -sLO "${base_url}${file}.sha1"
            curl -sLO "${base_url}${file}"

            # Check SHA1 file format (should contain exactly one line with 'hash  filename')
            if ! grep -E "^[0-9a-f]{40}  ${file}$" "${file}.sha1" >/dev/null 2>&1; then
            echo "⚠️  Invalid .sha1 file format for $file"
            rm -f "$file" "${file}.sha1"
            sleep 2
            ((attempt++))
            continue
            fi

            if sha1sum -c "${file}.sha1" > /dev/null 2>&1; then
            echo "✅ Verified $file (attempt $attempt)"
            success=true
            break
            else
            echo "❌ SHA-1 verification failed for $file (attempt $attempt)"
            rm -f "$file" "${file}.sha1"
            sleep 2
            ((attempt++))
            fi
        done

        if ! $success; then
            echo "Giving up on $file after $max_attempts attempts"
            continue
        fi

        if [ ! -f "touchpad/$file" ] || ! cmp -s "$file" "touchpad/$file"; then
            mv "$file" "touchpad/$file"
            changed=true
        else
            rm "$file"
        fi

        rm -f "${file}.sha1"
        done

        echo "changed=$changed" >> $GITHUB_OUTPUT


    - name: Commit updated files
      if: steps.sync.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add touchpad/
        git commit -m "Update synced files from MrChromebox"
        git push
